name: WordPress Plugin Check

on:
  pull_request:
    branches:
      - 'main'
  push:
    branches:
      - 'main'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wordpress-plugin-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin-check:
    name: WordPress Plugin Check
    runs-on: ubuntu-latest

    steps:
      - name: Check out plugin
        uses: actions/checkout@v4

      - name: Run WordPress Plugin Check
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: './'
          strict: false
          # Cloudflare Turnstile is an explicitly documented external service.
          # Ignore only Plugin Check's generic offloaded-content code; all other
          # current and future errors remain blocking.
          ignore-codes: PluginCheck.CodeAnalysis.Offloading.OffloadedContent
